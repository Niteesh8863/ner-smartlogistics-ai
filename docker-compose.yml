version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_spatial_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ner_secure_password_2026
      POSTGRES_DB: ner_smartlogistics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ner_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner_api_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:ner_secure_password_2026@db:5432/ner_smartlogistics
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ner-production-deployment-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner_pwa_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

